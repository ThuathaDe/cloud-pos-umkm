<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud POS & Inventaris UMKM</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">CloudPOS — Manajemen Inventaris & Kasir Berbasis Cloud</span>
    </div>
  </nav>

  <div class="container">
    <div class="row g-4">
      <!-- Kolom Kiri: Input Data -->
      <div class="col-md-5">
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white fw-bold">1. Input Transaksi Kasir</div>
          <div class="card-body">
            <form id="formTransaksi">
              <div class="mb-2">
                <label class="form-label">Pilih Produk</label>
                <select id="selectProduk" class="form-select" required></select>
              </div>
              <div class="mb-3">
                <label class="form-label">Jumlah Beli</label>
                <input type="number" id="jumlahBeli" class="form-control" min="1" value="1" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Proses Transaksi</button>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">2. Tambah Stok Produk Baru</div>
          <div class="card-body">
            <form id="formProduk">
              <div class="mb-2">
                <input type="text" id="namaProduk" class="form-control" placeholder="Nama Produk" required>
              </div>
              <div class="mb-2">
                <input type="number" id="hargaProduk" class="form-control" placeholder="Harga (Rp)" min="500" required>
              </div>
              <div class="mb-3">
                <input type="number" id="stokProduk" class="form-control" placeholder="Stok Awal" min="1" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Simpan Produk</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Kolom Kanan: Data Real-Time dari Cloud DB -->
      <div class="col-md-7">
        <div class="card shadow-sm mb-4">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">Daftar Inventaris (Cloud Database)</span>
            <button onclick="muatData()" class="btn btn-sm btn-outline-secondary">Refresh Data</button>
          </div>
          <div class="card-body table-responsive">
            <table class="table table-bordered table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Nama Produk</th>
                  <th>Harga</th>
                  <th>Sisa Stok</th>
                </tr>
              </thead>
              <tbody id="tabelProduk"></tbody>
            </table>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white fw-bold">Riwayat Transaksi Terbaru</div>
          <div class="card-body table-responsive">
            <table class="table table-sm table-striped mb-0">
              <thead>
                <tr>
                  <th>Produk</th>
                  <th>Qty</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="tabelTransaksi"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function muatData() {
      const resProduk = await fetch('/api/produk');
      const produkList = await resProduk.json();

      const tbodyProduk = document.getElementById('tabelProduk');
      const selectProduk = document.getElementById('selectProduk');
      tbodyProduk.innerHTML = '';
      selectProduk.innerHTML = '';

      produkList.forEach(p => {
        tbodyProduk.innerHTML += `
          <tr>
            <td>${p.id}</td>
            <td>${p.nama}</td>
            <td>Rp ${p.harga.toLocaleString('id-ID')}</td>
            <td><span class="badge ${p.stok > 5 ? 'bg-primary' : 'bg-danger'}">${p.stok}</span></td>
          </tr>`;
        selectProduk.innerHTML += `<option value="${p.id}">${p.nama} (Stok: ${p.stok})</option>`;
      });

      const resTrx = await fetch('/api/transaksi');
      const trxList = await resTrx.json();
      const tbodyTrx = document.getElementById('tabelTransaksi');
      tbodyTrx.innerHTML = '';
      trxList.forEach(t => {
        tbodyTrx.innerHTML += `
          <tr>
            <td>${t.nama_produk}</td>
            <td>${t.jumlah}</td>
            <td>Rp ${t.total_harga.toLocaleString('id-ID')}</td>
          </tr>`;
      });
    }

    document.getElementById('formProduk').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/produk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nama: document.getElementById('namaProduk').value,
          harga: document.getElementById('hargaProduk').value,
          stok: document.getElementById('stokProduk').value
        })
      });
      e.target.reset();
      muatData();
    });

    document.getElementById('formTransaksi').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/transaksi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          produk_id: document.getElementById('selectProduk').value,
          jumlah: document.getElementById('jumlahBeli').value
        })
      });
      const data = await res.json();
      if (!res.ok) alert(data.error);
      muatData();
    });

    muatData();
  </script>
</body>
</html>
